<div class="min-h-screen bg-gray-50 flex">
  <!-- Form Container -->
  <div class="flex-1 flex flex-col justify-center py-12 px-4 sm:px-6 lg:flex-none lg:px-20 xl:px-24 bg-white shadow-xl z-10">
    <div class="mx-auto w-full max-w-sm lg:w-96">
      <div class="text-center lg:text-left">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-900 text-white shadow-lg mb-6">
          <i class="bi bi-building text-3xl"></i>
        </div>
        <h2 class="text-3xl font-bold tracking-tight text-gray-900 font-serif">Hotel Luxury</h2>
        <p class="mt-2 text-sm text-gray-500">
          Inicie sesión en su portal administrativo
        </p>
      </div>

      <div class="mt-10">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          
          <div>
            <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Correo Electrónico</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="bi bi-person text-gray-400 text-lg"></i>
              </div>
              <input type="text" id="username" formControlName="username" 
                class="block w-full py-3 pl-11 pr-4 bg-gray-50 border-gray-200 rounded-xl text-sm focus:ring-slate-900 focus:border-slate-900 transition-colors" 
                placeholder="admin@luxuryhotel.com">
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label for="password" class="block text-sm font-semibold text-gray-700">Contraseña</label>
              <a href="#" class="text-xs font-semibold text-blue-600 hover:text-blue-500">¿Olvidó su contraseña?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="bi bi-shield-lock text-gray-400 text-lg"></i>
              </div>
              <input type="password" id="password" formControlName="password" 
                class="block w-full py-3 pl-11 pr-4 bg-gray-50 border-gray-200 rounded-xl text-sm focus:ring-slate-900 focus:border-slate-900 transition-colors" 
                placeholder="••••••••">
            </div>
          </div>

          <div *ngIf="error" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl">
            <div class="flex">
              <div class="flex-shrink-0">
                <i class="bi bi-exclamation-triangle-fill text-red-500"></i>
              </div>
              <div class="ml-3">
                <p class="text-sm font-medium text-red-800">{{error}}</p>
              </div>
            </div>
          </div>

          <div>
            <button type="submit" [disabled]="loginForm.invalid" 
              class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
              Ingresar al Sistema
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Image/Gradient Banner Container -->
  <div class="hidden lg:block relative w-0 flex-1 bg-slate-900">
    <!-- Overlay Gradient -->
    <div class="absolute inset-0 z-10 bg-gradient-to-br from-slate-900/90 via-slate-800/80 to-transparent"></div>
    
    <!-- Background Image placeholder (or just gradient if image fails) -->
    <img class="absolute inset-0 h-full w-full object-cover z-0 opacity-50" src="https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Hotel Background">
    
    <div class="absolute inset-0 z-20 flex flex-col items-center justify-center p-12 text-center">
      <h1 class="text-5xl font-bold tracking-tight mb-6 font-serif text-white drop-shadow-lg">Excelencia en cada detalle</h1>
      <p class="text-xl text-slate-200 max-w-lg mx-auto drop-shadow-md">Bienvenido al portal central de gestión para Hotel Luxury. Brindando un servicio inigualable a través de la tecnología.</p>
    </div>
  </div>
</div>
