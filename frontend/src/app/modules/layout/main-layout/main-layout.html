<div class="d-flex wrapper" [class.sidebar-collapsed]="!(sidebarVisible$ | async)">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Content -->
  <div class="main-content flex-grow-1 transition-all">
    <app-navbar></app-navbar>
    
    <main class="p-3 p-md-4">
      <router-outlet></router-outlet>
    </main>
  </div>
  
  <!-- Overlay para móviles -->
  <div class="sidebar-overlay d-md-none" 
       *ngIf="(sidebarVisible$ | async)" 
       (click)="toggleSidebar()">
  </div>

</div>
