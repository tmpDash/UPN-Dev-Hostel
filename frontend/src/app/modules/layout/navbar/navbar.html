<header class="sticky top-0 inset-x-0 flex flex-wrap sm:justify-start sm:flex-nowrap z-[48] w-full bg-white border-b border-gray-200 text-sm py-2.5 sm:py-4">
  <nav class="flex basis-full items-center w-full mx-auto px-4 sm:px-6" aria-label="Global">
    <div class="me-5 lg:me-0 lg:hidden">
      <!-- Sidebar Toggle -->
      <button type="button" (click)="toggleSidebar()" class="py-2 px-3 flex justify-center items-center gap-x-1.5 text-xs rounded-lg border border-gray-200 text-gray-500 hover:text-gray-600 hover:bg-gray-50 focus:outline-none">
        <i class="bi bi-list text-lg"></i>
        <span class="sr-only">Toggle Sidebar</span>
      </button>
    </div>

    <div class="w-full flex items-center justify-end ms-auto sm:justify-end sm:gap-x-3 sm:order-3">
      <div class="flex flex-row items-center justify-end gap-2">
        <button type="button" class="w-[2.375rem] h-[2.375rem] inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-full border border-transparent text-gray-800 hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none relative group">
          <i class="bi bi-bell"></i>
          <span class="absolute top-1 right-1 inline-flex items-center justify-center w-3 h-3 bg-red-500 text-white rounded-full text-[10px]"></span>
          
          <!-- Simple Dropdown alternative using hover -->
          <div class="absolute top-full right-0 mt-2 w-72 bg-white rounded-lg shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-left">
            <div class="px-4 py-3 border-b border-gray-100">
              <h3 class="font-semibold text-gray-800 text-sm">Notificaciones</h3>
            </div>
            <div class="py-1">
              <a href="#" class="block px-4 py-3 hover:bg-gray-50 transition-colors">
                <div class="flex items-start">
                  <div class="flex-shrink-0 bg-blue-100 text-blue-600 rounded-full w-8 h-8 flex items-center justify-center mr-3">
                    <i class="bi bi-calendar-check"></i>
                  </div>
                  <div>
                    <p class="text-sm font-medium text-gray-800">Nueva reserva confirmada</p>
                    <p class="text-xs text-gray-500 mt-1">Hace 5 minutos</p>
                  </div>
                </div>
              </a>
              <a href="#" class="block px-4 py-3 hover:bg-gray-50 transition-colors border-t border-gray-50">
                <div class="flex items-start">
                  <div class="flex-shrink-0 bg-amber-100 text-amber-600 rounded-full w-8 h-8 flex items-center justify-center mr-3">
                    <i class="bi bi-exclamation-triangle"></i>
                  </div>
                  <div>
                    <p class="text-sm font-medium text-gray-800">El huésped requiere asistencia</p>
                    <p class="text-xs text-gray-500 mt-1">Hace 15 minutos</p>
                  </div>
                </div>
              </a>
            </div>
            <div class="px-4 py-2 border-t border-gray-100 text-center">
              <a href="#" class="text-xs text-blue-600 hover:text-blue-700 font-medium">Ver todo</a>
            </div>
          </div>
        </button>

        <div class="relative group" *ngIf="currentUser$ | async as user">
          <button type="button" class="w-[2.375rem] h-[2.375rem] inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-full border border-transparent text-gray-800 hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none">
            <img class="inline-block h-[2.375rem] w-[2.375rem] rounded-full aspect-square object-cover" src="https://ui-avatars.com/api/?name={{user.fullName}}&background=0F172A&color=fff" alt="Image Description">
          </button>
          
          <div class="absolute top-full right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-3 px-5 bg-gray-50 rounded-t-lg">
              <p class="text-sm text-gray-500">Conectado como</p>
              <p class="text-sm font-medium text-gray-800 truncate">{{user.fullName}}</p>
            </div>
            <div class="py-1">
              <a routerLink="/settings/profile" class="flex items-center gap-x-3.5 py-2 px-5 text-sm text-gray-800 hover:bg-gray-100">
                <i class="bi bi-person w-4"></i> Mi Perfil
              </a>
              <a routerLink="/settings/config" class="flex items-center gap-x-3.5 py-2 px-5 text-sm text-gray-800 hover:bg-gray-100">
                <i class="bi bi-gear w-4"></i> Configuración
              </a>
              <div class="border-t border-gray-100 my-1"></div>
              <button (click)="onLogout()" class="w-full flex items-center gap-x-3.5 py-2 px-5 text-sm text-red-600 hover:bg-red-50 text-left">
                <i class="bi bi-box-arrow-right w-4"></i> Cerrar Sesión
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
