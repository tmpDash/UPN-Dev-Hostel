<div class="h-full bg-white border-r border-gray-200 w-64 fixed flex flex-col transition-all duration-300 z-50">
  <div class="p-6 flex items-center border-b border-gray-100">
    <img src="/assets/img/logo.png" alt="Logo" class="h-10 w-10 rounded shadow-sm">
    <div class="ml-3">
      <h2 class="text-lg font-bold text-slate-900 tracking-tight font-serif">HOTEL LUXURY</h2>
      <p class="text-xs text-gray-500 uppercase tracking-widest">Management</p>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto p-4 space-y-1">
    <a *ngIf="canAccess('dashboard')" routerLink="/dashboard" routerLinkActive="bg-slate-50 text-slate-900 font-medium" [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center px-4 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-50 hover:text-slate-900 transition-colors group">
      <i class="bi bi-grid w-5 h-5 mr-3 text-gray-400 group-hover:text-slate-900"></i>
      Tablero
    </a>

    <a *ngIf="canAccess('reservations')" routerLink="/reservations" routerLinkActive="bg-slate-50 text-slate-900 font-medium"
       class="flex items-center px-4 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-50 hover:text-slate-900 transition-colors group">
      <i class="bi bi-calendar-check w-5 h-5 mr-3 text-gray-400 group-hover:text-slate-900"></i>
      Reservas
    </a>

    <a *ngIf="canAccess('services')" routerLink="/services" routerLinkActive="bg-slate-50 text-slate-900 font-medium"
       class="flex items-center px-4 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-50 hover:text-slate-900 transition-colors group">
      <i class="bi bi-tags w-5 h-5 mr-3 text-gray-400 group-hover:text-slate-900"></i>
      Servicios
    </a>

    <a *ngIf="canAccess('reports')" routerLink="/reports" routerLinkActive="bg-slate-50 text-slate-900 font-medium"
       class="flex items-center px-4 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-50 hover:text-slate-900 transition-colors group">
      <i class="bi bi-graph-up w-5 h-5 mr-3 text-gray-400 group-hover:text-slate-900"></i>
      Reportes
    </a>

    <a *ngIf="canAccess('users')" routerLink="/users" routerLinkActive="bg-slate-50 text-slate-900 font-medium"
       class="flex items-center px-4 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-50 hover:text-slate-900 transition-colors group">
      <i class="bi bi-people w-5 h-5 mr-3 text-gray-400 group-hover:text-slate-900"></i>
      Usuarios de Personal
    </a>
  </nav>

  <div class="p-4 border-t border-gray-100" *ngIf="currentUser$ | async as user">
    <div class="relative inline-block text-left w-full group">
      <button type="button" class="flex items-center w-full p-2 text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-50 focus:outline-none">
        <img class="h-8 w-8 rounded-full aspect-square object-cover" src="https://ui-avatars.com/api/?name={{user.fullName}}&background=0F172A&color=fff" alt="">
        <div class="ml-3 text-left flex-1">
          <p class="text-sm font-medium text-slate-900">{{user.fullName}}</p>
          <p class="text-xs text-gray-500">{{user.role}}</p>
        </div>
        <i class="bi bi-chevron-expand text-gray-400"></i>
      </button>

      <!-- Simple Dropdown alternative using hover since we removed Bootstrap JS -->
      <div class="absolute bottom-12 left-0 w-full bg-white rounded-lg shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
        <div class="py-1">
          <a routerLink="/settings/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Configuración de Perfil</a>
          <button (click)="onLogout()" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Cerrar Sesión</button>
        </div>
      </div>
    </div>
  </div>
</div>
