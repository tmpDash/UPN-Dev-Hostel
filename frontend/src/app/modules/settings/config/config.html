<!-- Page Header -->
<div class="mb-8">
  <h2 class="text-2xl font-bold text-gray-800 font-serif">Configuración del Sistema</h2>
  <p class="text-sm text-gray-500 mt-1">Ajuste los parámetros generales de la plataforma.</p>
</div>

<div class="bg-white border border-gray-200 rounded-xl shadow-sm lg:w-3/4 mx-auto">
  <div class="p-6 sm:p-8">
    
    <!-- Section 1 -->
    <div class="mb-8 pb-8 border-b border-gray-100">
      <h5 class="text-lg font-bold text-gray-800 mb-5 flex items-center gap-2">
        <div class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-50 text-blue-600">
          <i class="bi bi-globe"></i>
        </div>
        Localización y Moneda
      </h5>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">Moneda Principal</label>
          <select class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900" [(ngModel)]="settings.currency">
            <option value="USD">Dólar Estadounidense (USD)</option>
            <option value="PEN">Soles Peruanos (PEN)</option>
            <option value="EUR">Euro (EUR)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">Idioma del Sistema</label>
          <select class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900" [(ngModel)]="settings.language">
            <option value="ES">Español</option>
            <option value="EN">Inglés</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Section 2 -->
    <div class="mb-8 pb-8 border-b border-gray-100">
      <h5 class="text-lg font-bold text-gray-800 mb-5 flex items-center gap-2">
        <div class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-50 text-blue-600">
          <i class="bi bi-bell"></i>
        </div>
        Preferencias de Notificación
      </h5>
      
      <div class="flex items-center justify-between mb-4">
        <div>
          <label for="emailNotif" class="text-sm font-medium text-gray-800">Alertas por Email</label>
          <p class="text-sm text-gray-500">Recibir notificaciones de nuevas reservas por email.</p>
        </div>
        <div class="flex items-center">
          <label class="flex items-center cursor-pointer relative" for="emailNotif">
            <input type="checkbox" id="emailNotif" [(ngModel)]="settings.emailNotifications" class="sr-only">
            <div class="w-11 h-6 bg-gray-200 rounded-full transition-colors duration-200 ease-in-out" [class.bg-slate-900]="settings.emailNotifications"></div>
            <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 ease-in-out shadow-sm" [class.translate-x-5]="settings.emailNotifications"></div>
          </label>
        </div>
      </div>
      
      <div class="flex items-center justify-between">
        <div>
          <label for="backupNotif" class="text-sm font-medium text-gray-800">Copia de Seguridad Automática</label>
          <p class="text-sm text-gray-500">Habilitar backups semanales automáticos de la base de datos.</p>
        </div>
        <div class="flex items-center">
          <label class="flex items-center cursor-pointer relative" for="backupNotif">
            <input type="checkbox" id="backupNotif" [(ngModel)]="settings.autoBackup" class="sr-only">
            <div class="w-11 h-6 bg-gray-200 rounded-full transition-colors duration-200 ease-in-out" [class.bg-slate-900]="settings.autoBackup"></div>
            <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 ease-in-out shadow-sm" [class.translate-x-5]="settings.autoBackup"></div>
          </label>
        </div>
      </div>
    </div>



    <!-- Actions -->
    <div class="mt-8 pt-5 border-t border-gray-100 flex justify-end">
      <button (click)="onSave()" class="py-2.5 px-6 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-50 disabled:pointer-events-none transition-colors shadow-sm">
        Guardar Ajustes
      </button>
    </div>
    
  </div>
</div>
