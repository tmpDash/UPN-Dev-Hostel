<!-- Page Header -->
<div class="mb-8">
  <h2 class="text-2xl font-bold text-gray-800 font-serif">Mi Perfil</h2>
  <p class="text-sm text-gray-500 mt-1">Gestione su información personal y de contacto.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8" *ngIf="currentUser$ | async as user">
  
  <!-- Left Panel: Avatar & Summary -->
  <div class="md:col-span-1">
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm text-center p-6 flex flex-col items-center">
      <div class="relative inline-block mb-4">
        <img class="inline-block w-32 h-32 rounded-full border-4 border-white shadow-sm aspect-square object-cover" 
             src="https://ui-avatars.com/api/?name={{user.fullName}}&background=0F172A&color=fff&size=128" 
             alt="Avatar del Perfil">
        <button type="button" class="absolute bottom-0 right-0 py-2 px-2 inline-flex justify-center items-center gap-2 rounded-full border border-transparent font-semibold bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all text-sm shadow-md">
          <i class="bi bi-camera"></i>
        </button>
      </div>
      <h4 class="text-xl font-bold text-gray-800 mb-1">{{user.fullName}}</h4>
      <p class="text-sm text-gray-500 font-medium mb-5">{{user.role}}</p>
      
      <div class="w-full">
        <button type="button" class="w-full py-2 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none transition-colors">
          Cambiar Contraseña
        </button>
      </div>
    </div>
  </div>

  <!-- Right Panel: Profile Form -->
  <div class="md:col-span-2">
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 lg:p-8">
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
          
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-700">Nombre Completo</label>
            <input type="text" formControlName="fullName" class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-700">Correo Electrónico</label>
            <input type="email" formControlName="email" class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-700">Teléfono</label>
            <input type="text" formControlName="phone" class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-2 text-gray-700">Departamento</label>
            <input type="text" formControlName="department" readonly class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-500 focus:border-slate-900 focus:ring-slate-900">
          </div>
          
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium mb-2 text-gray-700">Biografía</label>
            <textarea formControlName="bio" rows="4" class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900"></textarea>
          </div>
          
        </div>
        
        <div class="mt-8 pt-5 border-t border-gray-100 flex justify-end">
          <button type="submit" [disabled]="profileForm.invalid" class="py-2.5 px-5 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-50 disabled:pointer-events-none transition-colors shadow-sm">
            Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
