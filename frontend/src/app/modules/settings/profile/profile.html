<div class="row mb-4">
  <div class="col">
    <h2 class="fw-bold">Mi Perfil</h2>
    <p class="text-muted">Gestione su información personal y de contacto.</p>
  </div>
</div>

<div class="row g-4" *ngIf="currentUser$ | async as user">
  <div class="col-md-4">
    <div class="card border-0 shadow-sm text-center p-4">
      <div class="position-relative d-inline-block mx-auto mb-3">
        <img src="https://ui-avatars.com/api/?name={{user.fullName}}&background=0D47A1&color=fff&size=128" 
             alt="Profile Avatar" class="rounded-circle shadow-sm border border-4 border-white" width="128" height="128" aria-hidden="true">
        <button class="btn btn-primary btn-sm rounded-circle position-absolute bottom-0 end-0 p-2">
          <i class="bi bi-camera"></i>
        </button>
      </div>
      <h4 class="fw-bold mb-1">{{user.fullName}}</h4>
      <p class="text-muted small mb-3">{{user.role}}</p>
      <div class="d-grid">
        <button class="btn btn-outline-primary btn-sm">Cambiar Contraseña</button>
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <div class="card border-0 shadow-sm p-4">
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold small">Nombre Completo</label>
            <input type="text" formControlName="fullName" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">Correo Electrónico</label>
            <input type="email" formControlName="email" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">Teléfono</label>
            <input type="text" formControlName="phone" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">Departamento</label>
            <input type="text" formControlName="department" class="form-control" readonly>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold small">Biografía</label>
            <textarea formControlName="bio" class="form-control" rows="4"></textarea>
          </div>
        </div>
        <div class="mt-4 pt-3 border-top d-flex justify-content-end">
          <button type="submit" class="btn btn-primary px-4 shadow" [disabled]="profileForm.invalid">
            Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
