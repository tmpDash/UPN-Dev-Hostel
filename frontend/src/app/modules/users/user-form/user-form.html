<div class="row mb-4">
  <div class="col">
    <h2 class="fw-bold">{{ isEdit ? 'Editar Miembro del Staff' : 'Nuevo Miembro del Staff' }}</h2>
    <p class="text-muted">{{ isEdit ? 'Actualice la información del usuario.' : 'Registre una nueva cuenta administrativa.' }}</p>
  </div>
</div>

<div class="card border-0 shadow-sm col-lg-8">
  <div class="card-body p-4">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-medium">Nombre Completo</label>
          <input type="text" formControlName="fullName" class="form-control" placeholder="Ej. Roberto Gómez">
        </div>
        
        <div class="col-md-6">
          <label class="form-label fw-medium">Correo Electrónico</label>
          <input type="email" formControlName="email" class="form-control" placeholder="roberto@hotel.com">
        </div>
        
        <div class="col-md-6">
          <label class="form-label fw-medium">Rol en el Sistema</label>
          <select formControlName="role" class="form-select">
            <option value="ADMIN">Administrador</option>
            <option value="RECEPCIONISTA">Recepcionista</option>
            <option value="SUPERVISOR">Supervisor</option>
            <option value="LIMPIEZA">Staff de Limpieza</option>
          </select>
        </div>
        
        <div class="col-md-6">
          <label class="form-label fw-medium">Estado</label>
          <select formControlName="status" class="form-select">
            <option value="ACTIVO">Activo</option>
            <option value="INACTIVO">Inactivo</option>
          </select>
        </div>
        
        <div class="col-md-12">
          <label class="form-label fw-medium">{{ isEdit ? 'Nueva Contraseña (opcional)' : 'Contraseña Temporal' }}</label>
          <input type="password" formControlName="password" class="form-control" placeholder="Mínimo 6 caracteres">
        </div>
      </div>
      
      <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-light px-4" routerLink="/users">Cancelar</button>
        <button type="submit" class="btn btn-primary px-4" [disabled]="userForm.invalid">
          {{ isEdit ? 'Guardar Cambios' : 'Crear Cuenta' }}
        </button>
      </div>
    </form>
  </div>
</div>
