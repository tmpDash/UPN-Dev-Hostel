<!-- Page Header -->
<div class="mb-8">
  <h2 class="text-2xl font-bold text-gray-800 font-serif">{{ isEdit ? 'Editar Personal' : 'Nuevo Miembro del Personal' }}</h2>
  <p class="text-sm text-gray-500 mt-1">{{ isEdit ? 'Actualizar información del usuario.' : 'Registrar una nueva cuenta administrativa.' }}</p>
</div>

<!-- Form Card -->
<div class="bg-white border border-gray-200 rounded-xl shadow-sm lg:w-2/3">
  <div class="p-6">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
        
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700">Nombre Completo</label>
          <input type="text" formControlName="fullName" class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900" placeholder="Ej. Roberto Gómez">
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700">Correo Electrónico</label>
          <input type="email" formControlName="email" class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900" placeholder="roberto@luxuryhotel.com">
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700">Rol de Sistema</label>
          <select formControlName="role" class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900">
            <option value="ADMIN">Administrador</option>
            <option value="RECEPCIONISTA">Recepcionista</option>
            <option value="SUPERVISOR">Supervisor</option>
            <option value="LIMPIEZA">Personal de Limpieza</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-700">Estado</label>
          <select formControlName="status" class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900">
            <option value="ACTIVO">Activo</option>
            <option value="INACTIVO">Inactivo</option>
          </select>
        </div>
        
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-2 text-gray-700">{{ isEdit ? 'Nueva Contraseña (opcional)' : 'Contraseña Temporal' }}</label>
          <input type="password" formControlName="password" class="py-2.5 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-slate-900 focus:ring-slate-900" placeholder="Mínimo 6 caracteres">
        </div>
      </div>
      
      <div class="mt-8 pt-5 border-t border-gray-100 flex justify-end gap-x-2">
        <button type="button" routerLink="/users" class="py-2.5 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="userForm.invalid" class="py-2.5 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-50 disabled:pointer-events-none transition-colors shadow-sm">
          {{ isEdit ? 'Guardar Cambios' : 'Crear Cuenta' }}
        </button>
      </div>
    </form>
  </div>
</div>
